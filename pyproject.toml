[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-evals"
version = "0.1.0"
description = "Deterministic evidence for probabilistic systems: a small, dependency-free toolkit to evaluate LLM, RAG and agent outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Invarizon" }]
keywords = ["llm", "evaluation", "rag", "testing", "quality-engineering", "robot-framework"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
robot = ["robotframework>=7"]

[project.scripts]
evidence-evals = "evidence_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
